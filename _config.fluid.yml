favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

force_https: false

code:
  copy_btn: true
  language:
    enable: true
    default: TEXT
  highlight:
    enable: true
    line_number: true
    lib: highlightjs
    highlightjs:
      style: github gist
      style_dark: dark

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f4f0e8"
  body_bg_color_dark: "#151713"
  navbar_bg_color: "#181914"
  navbar_bg_color_dark: "#11130f"
  navbar_text_color: "#f5f0e7"
  navbar_text_color_dark: "#e8e0d3"
  subtitle_color: "#f8f1e8"
  subtitle_color_dark: "#ede4d7"
  text_color: "#24251f"
  text_color_dark: "#ddd5c7"
  sec_text_color: "#716b5f"
  sec_text_color_dark: "#a7a091"
  board_color: "#fbf8f0"
  board_color_dark: "#1b1e18"
  post_text_color: "#252620"
  post_text_color_dark: "#e0d8cb"
  post_heading_color: "#171812"
  post_heading_color_dark: "#f0e8db"
  post_link_color: "#55715b"
  post_link_color_dark: "#b6c7a8"
  link_hover_color: "#7b5f2a"
  link_hover_color_dark: "#d8bd7a"
  link_hover_bg_color: "rgba(122, 95, 42, 0.10)"
  link_hover_bg_color_dark: "rgba(216, 189, 122, 0.12)"
  line_color: "#ddd4c4"
  line_color_dark: "#34382f"
  scrollbar_color: "#c7bcaa"
  scrollbar_color_dark: "#4a5144"
  scrollbar_hover_color: "#9c917f"
  scrollbar_hover_color_dark: "#707b68"
  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "rgba(85, 113, 91, 0.10)"
  button_hover_bg_color_dark: "rgba(182, 199, 168, 0.10)"

font:
  font_size: 16px
  font_family: "Cormorant Garamond, Noto Serif SC, Source Han Serif SC, Songti SC, serif"
  letter_spacing: 0.015em
  code_font_size: 88%

custom_css: /css/awake-theme.css

fun_features:
  typing:
    enable: false
  anchorjs:
    enable: true
    element: h1,h2,h3,h4,h5,h6
    placement: left
    visible: hover
    icon: ""
  progressbar:
    enable: true
    height_px: 2
    color: "#7b5f2a"
    options: { showSpinner: false, trickleSpeed: 120 }

navbar:
  blog_title: "AwaKeSpace"
  ground_glass:
    enable: false
  menu:
    - { key: "home", name: "Index", link: "/" }
    - { key: "archive", name: "Archive", link: "/archives/" }
    - { key: "category", name: "Categories", link: "/categories/" }
    - { key: "tag", name: "Tags", link: "/tags/" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: false
  width_height_ratio: 1.0

scroll_down_arrow:
  enable: true
  banner_height_limit: 60
  scroll_after_turning_page: true

scroll_top_arrow:
  enable: true

footer:
  content: '<span>AwaKeSpace</span><span class="footer-divider">/</span><span>quiet notes, carefully kept</span>'
  statistics:
    enable: false
  beian:
    enable: false

index:
  banner_img: /img/banner.jpg
  banner_img_height: 72
  banner_mask_alpha: 0.18
  slogan:
    enable: true
    text: "请赐我平静的心去接受我无法改变的，请赐我勇敢的心去改变我能改变的，请赐我智慧的心去辨别它们。"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: false
  post_sticky:
    enable: true
    icon: "iconfont icon-top"

post:
  banner_img: /img/default.png
  banner_img_height: 46
  banner_mask_alpha: 0.16
  default_index_img:
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY.MM.DD"
    wordcount:
      enable: true
    min2read:
      enable: true
    views:
      enable: false
  updated:
    enable: false
  comments:
    enable: false
  prev_next:
    enable: true
  copyright:
    enable: false
  toc:
    enable: true
    headingSelector: h1,h2,h3
    collapseDepth: 0
  footnote:
    enable: true
  math:
    enable: false
  mermaid:
    enable: false
  custom:
    enable: false

archive:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.16

category:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.16
  post_order_by: "-date"
  post_limit: 10

tag:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.16

about:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.16
  avatar: /img/avatar.png
  name: AwaKe
  intro: 一个安静的个人博客
