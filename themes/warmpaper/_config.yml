# Warmpaper Theme Configuration

# Navigation menu
menu:
  Home: /
  Photos: /photos
  ZATO: /zato/
  Archives: /archives
  Tags: /tags
  Categories: /categories
  About: /about

# Table of Contents (right sidebar on post pages)
toc:
  enable: true
  max_depth: 3
  min_depth: 2
  list_number: false

# Profile (shown on homepage above post list)
profile:
  avatar: /images/logo.svg
  description: "请赐我平静的心去接受我无法改变的，请赐我勇敢的心去改变我能够改变的，请赐我智慧的心去辨别它们。"
  links:
    - name: GitHub
      url: https://github.com/NachtLang
      icon: github
    - name: Website
      url: https://www.stayawake.top
      icon: website

# Post excerpt
excerpt_link: 阅读全文

# Snapshot strip on homepage（随手拍主页板块）
snapshot:
  home_count: 3   # 主页展示最近几张，建议 3-5

# Footer
copyright: "© AwaKeSpace"
